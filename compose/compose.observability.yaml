# Observability Stack - Complete monitoring platform
# Includes Prometheus (metrics), Loki (logs), Tempo (traces), and Grafana (visualization)
services:
  # Prometheus - Time-series metrics database
  prometheus:
    image: prom/prometheus:v3.9.1 
    container_name: prometheus
    command:  # Prometheus startup arguments
      - '--config.file=/etc/prometheus/prometheus.yaml'  # Config file location
      - '--storage.tsdb.path=/prometheus'  # TSDB storage location
      - '--storage.tsdb.retention.time=15d'  # Keep metrics for 15 days
    volumes:  # Mount configuration and data
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro  # Read-only config
      - prometheus-data:/prometheus  # Persistent metrics storage
    ports:  # Expose Prometheus UI
      - '9090:9090'  # Prometheus web UI and API
    networks:  # Connect to observability network
      - observability
    restart: unless-stopped  # Auto-restart on failure

  # Loki - Log aggregation system
  loki:
    image: grafana/loki:3.6.6
    container_name: loki
    user: root  # Run as root for file permissions
    command:  # Loki startup arguments
      - '-config.file=/etc/loki/loki-config.yaml'  # Config file location
      - '-target=all'  # Run all Loki components
    volumes:  # Mount configuration and data
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro  # Read-only config
      - loki-data:/loki  # Log chunk storage
      - loki-wal:/wal  # Write-ahead log
    ports:  # Expose Loki API
      - '3100:3100'  # Loki HTTP API
    networks:  # Connect to observability network
      - observability
    restart: unless-stopped  # Auto-restart on failure

  # Tempo - Distributed tracing system
  tempo:
    image: grafana/tempo:2.10.1
    container_name: tempo
    command:  # Tempo startup arguments
      - '-config.file=/etc/tempo/tempo-config.yaml'  # Config file location
      - '-target=all'  # Run all Tempo components
    volumes:  # Mount configuration and data
      - ./tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro  # Read-only config
    ports:  # Expose Tempo API
      - '3200:3200'  # Tempo HTTP API
    networks:  # Connect to observability network
      - observability
    restart: unless-stopped  # Auto-restart on failure

  # Grafana - Visualization and alerting platform
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:  # Configure Grafana settings
      - GF_AUTH_ANONYMOUS_ENABLED=true  # Allow anonymous access without login
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin  # Grant admin privileges to anonymous users
      - GF_SECURITY_ADMIN_PASSWORD=admin  # Default admin password
    volumes:  # Mount configuration and data
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro  # Auto-provision datasources
      - grafana-data:/var/lib/grafana  # Persistent dashboard and settings storage
    ports:  # Expose Grafana web UI
      - '3000:3000'  # Grafana web interface
    networks:  # Connect to observability network
      - observability
    restart: unless-stopped  # Auto-restart on failure
    depends_on:  # Wait for these services before starting
      - prometheus  # Requires Prometheus for metrics
      - loki  # Requires Loki for logs
      - tempo  # Requires Tempo for traces

  services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    container_name: otel-collector
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
      - '8889:8889' # Prometheus metrics exporter
    networks:
      - observability
      - app
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo

  # ... existing services (prometheus, loki, tempo, grafana) ...


# Named volumes for persistent data storage across container restarts
volumes:
  prometheus-data:  # Stores time-series metrics data (15-day retention)
  loki-data:  # Stores compressed log chunks
  loki-wal:  # Stores Loki write-ahead logs for durability
  grafana-data:  # Stores Grafana dashboards, provisioning configs, and settings
